# Page: device
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: device
label: Device
icon: device
order: 6
remote_configurable: true
description: Device behavior, units, and recording settings
sections:
- id: general
  title: General
  description: Power, boot, and unit preferences
  items:
  - key: OffroadMode
    widget: toggle
    title: Force Offroad Mode
  - key: DeviceBootMode
    widget: option
    title: Wake Up Behavior
    description: 'Controls state of the device after boot/sleep. Default: Device will boot/wake-up normally and will be ready
      to engage. Offroad: Device will be in Always Offroad mode after boot/wake-up.'
    options:
    - value: 0
      label: Standard
    - value: 1
      label: Always Offroad
  - key: QuietMode
    widget: toggle
    title: Quiet Mode
  - key: EngageVolume
    widget: option
    title: Engage Chime Volume
    description: 0 mutes, 1 to 100 is a fixed percentage, 101 is automatic (ambient-noise based).
    min: 0
    max: 101
    step: 1
  - key: DisengageVolume
    widget: option
    title: Disengage Chime Volume
    description: 0 mutes, 1 to 100 is a fixed percentage, 101 is automatic.
    min: 0
    max: 101
    step: 1
  - key: PromptVolume
    widget: option
    title: Prompt Volume
    description: 0 mutes, 1 to 100 is a fixed percentage, 101 is automatic.
    min: 0
    max: 101
    step: 1
  - key: PromptDistractedVolume
    widget: option
    title: Distracted Prompt Volume
    description: 0 mutes, 1 to 100 is a fixed percentage, 101 is automatic.
    min: 0
    max: 101
    step: 1
  - key: RefuseVolume
    widget: option
    title: Refuse Chime Volume
    description: 0 mutes, 1 to 100 is a fixed percentage, 101 is automatic.
    min: 0
    max: 101
    step: 1
  - key: WarningSoftVolume
    widget: option
    title: Soft Warning Volume
    description: Never below 25 percent. 101 is automatic.
    min: 0
    max: 101
    step: 1
  - key: WarningImmediateVolume
    widget: option
    title: Immediate Warning Volume
    description: Never below 25 percent. 101 is automatic.
    min: 0
    max: 101
    step: 1
  - key: OnroadUploads
    widget: toggle
    title: Onroad Uploads
  - key: MaxTimeOffroad
    widget: option
    title: Max Time Offroad
    description: Device will automatically shutdown after set time once the engine is turned off. 30h is the default.
    options:
    - value: 0
      label: Always On
    - value: 5
      label: 5m
    - value: 10
      label: 10m
    - value: 15
      label: 15m
    - value: 30
      label: 30m
    - value: 60
      label: 1h
    - value: 120
      label: 2h
    - value: 180
      label: 3h
    - value: 300
      label: 5h
    - value: 600
      label: 10h
    - value: 1440
      label: 24h
    - value: 1800
      label: 30h (Default)
- id: language
  title: Language
  items:
  - key: LanguageSetting
    widget: info
    title: Language
